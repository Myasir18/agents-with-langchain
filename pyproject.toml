[project]
name = "learning-companion"
version = "0.1.0"
description = "Learning Companion: a small OpenAI-compatible chat API for the LangChain classroom course."
readme = "README.md"
authors = [
    { name = "Myasir18", email = "mohmmadyasir18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-groq>=1.1.3",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
